<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cat Clock</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #bubble { position: fixed; display: none; background: #FFF8EC; border: 1.5px solid #E2C9A6; border-radius: 16px;
      padding: 8px 14px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.25); text-align: center;
      font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", -apple-system, system-ui, sans-serif; }
    #bubble .t { font-size: 15px; font-weight: 700; color: #8A4B2A; }
    #bubble .l { font-size: 13px; color: #6B5A4A; margin: 2px 0 6px; }
    #bubble button { font: inherit; font-size: 13px; border-radius: 10px; padding: 4px 12px; cursor: pointer; border: 1px solid #D9BFA0; background: #FFFDF8; color: #6B4A32; }
    #bubble button.main { background: #C9733F; border-color: #B5612F; color: white; font-weight: 600; }
    #bubble button + button { margin-left: 8px; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="bubble"><div class="t">⏰ Time to call!&nbsp; 该打电话了</div><div class="l" id="bubbleLabel"></div>
    <button class="main" id="stopBtn">Stop&nbsp; 停</button><button id="snoozeBtn">5 min&nbsp; 再等5分钟</button></div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
