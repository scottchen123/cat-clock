# Push a tag like v0.1.0 -> builds installers for Windows (.msi/.exe) and macOS (.dmg, Intel + Apple Silicon)
# and attaches them to a draft GitHub Release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cat Clock ${{ github.ref_name }}"
          releaseBody: "Windows: download the .msi or -setup.exe and run it. macOS: open the .dmg and drag Cat Clock to Applications. The app is not notarized, so the first time: System Settings → Privacy & Security → Open Anyway (or run: xattr -cr \"/Applications/Cat Clock.app\")."
          releaseDraft: true
          args: ${{ matrix.args }}
